[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syntecxhub-encrypted-chat"
version = "1.0.0"
description = "Multi-client TCP chat with X25519 key exchange, passphrase authentication and AES-256-GCM encryption"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Junaideen Risny Suha" }]
dependencies = ["cryptography>=41"]
keywords = ["cybersecurity", "aes-gcm", "x25519", "chat", "asyncio"]

[project.optional-dependencies]
dev = ["ruff"]

[project.scripts]
chat-server = "syntecxhub_chat.server:main"
chat-client = "syntecxhub_chat.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
